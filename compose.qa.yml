# Nombre de proyecto aislado en Compose (Crucial para no chocar con PROD)
name: qa

services:
  # Base de datos PostgreSQL aislada de QA
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres123}
      POSTGRES_DB: app_qa
    volumes:
      - db_data_qa:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/1_schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/2_seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  # Backend QA: Consume la imagen inmutable de ghcr.io (sin recompilar localmente)
  backend:
    image: ghcr.io/bistolfibri/ingsoft3-tp01-backend:${IMAGE_TAG:-latest}
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: app_qa
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgres123}
      PORT: 3001
    ports:
      - "8080:3001" # API de QA en http://localhost:8080
    depends_on:
      db:
        condition: service_healthy

  # Frontend QA: Consume la imagen inmutable de ghcr.io
  frontend:
    image: ghcr.io/bistolfibri/ingsoft3-tp01-frontend:${IMAGE_TAG:-latest}
    environment:
      BACKEND_URL: http://backend:3001
      DNS_RESOLVER: 127.0.0.11
    ports:
      - "3000:80" # Web de QA en http://localhost:3000
    depends_on:
      - backend

volumes:
  db_data_qa:
  