name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # =========================================================================
  # JOB 1: VERIFICACIÓN Y PUBLICACIÓN DEL BACKEND
  # =========================================================================
  build-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Bajar el código al runner
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias del backend
        run: npm ci
        working-directory: ./backend

      - name: Ejecutar Unit Tests y Cobertura del Backend
        run: npm run test:coverage
        working-directory: ./backend

      - name: Subir Reporte de Cobertura del Backend
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-backend
          path: ./backend/coverage

      - name: Resumen de cobertura del Backend en el Summary del run
        if: always()
        working-directory: ./backend
        run: |
          node -e "
          const fs=require('fs');
          const f='coverage/coverage-summary.json';
          let out='### Cobertura del Backend (unit tests)\\n\\n';
          if(!fs.existsSync(f)){out+='No se generó el reporte de cobertura (falló antes).\\n';}
          else{
            const t=JSON.parse(fs.readFileSync(f)).total;
            out+='| Métrica | Cobertura | Cubiertas / Total |\\n|---|---|---|\\n';
            for(const k of ['lines','statements','functions','branches']){
              out+='| '+k+' | '+t[k].pct+'% | '+t[k].covered+' / '+t[k].total+' |\\n';
            }
          }
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,out);
          "

      - name: Entrar al registry (ghcr.io)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Preparar constructor Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir y publicar imagen del Backend (Solo en main)
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository }}-backend:sha-${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  # =========================================================================
  # JOB 2: VERIFICACIÓN Y PUBLICACIÓN DEL FRONTEND
  # =========================================================================
  build-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Bajar el código al runner
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias del frontend
        run: npm ci
        working-directory: ./frontend

      - name: Ejecutar Unit Tests y Cobertura del Frontend
        run: npm run test:coverage
        working-directory: ./frontend

      - name: Subir Reporte de Cobertura del Frontend
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-frontend
          path: ./frontend/coverage

      - name: Resumen de cobertura del Frontend en el Summary del run
        if: always()
        working-directory: ./frontend
        run: |
          node -e "
          const fs=require('fs');
          const f='coverage/coverage-summary.json';
          let out='### Cobertura del Frontend (unit tests)\\n\\n';
          if(!fs.existsSync(f)){out+='No se generó el reporte de cobertura (falló antes).\\n';}
          else{
            const t=JSON.parse(fs.readFileSync(f)).total;
            out+='| Métrica | Cobertura | Cubiertas / Total |\\n|---|---|---|\\n';
            for(const k of ['lines','statements','functions','branches']){
              out+='| '+k+' | '+t[k].pct+'% | '+t[k].covered+' / '+t[k].total+' |\\n';
            }
          }
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,out);
          "

      - name: Entrar al registry (ghcr.io)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Preparar constructor Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir y publicar imagen del Frontend (Solo en main)
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository }}-frontend:sha-${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # =========================================================================
  # JOB 3: DESPLIEGUE AUTOMÁTICO EN QA (Render ejecuta la IMAGEN publicada)
  # =========================================================================
  # El hook de Render NO reconstruye nada: le decimos QUÉ imagen ejecutar con imgURL.
  # Las URLs de cada entorno son variables del repositorio (Settings > Variables).
  deploy-qa:
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]   # sin CI verde no hay imagen, y sin imagen no hay deploy
    if: github.ref == 'refs/heads/main'      # los PRs verifican; solo main despliega
    environment: qa
    steps:
      - name: Desplegar en QA la IMAGEN del commit (api + front)
        shell: bash
        env:
          HOOK_API: ${{ secrets.RENDER_HOOK_API_QA }}
          HOOK_FRONT: ${{ secrets.RENDER_HOOK_FRONT_QA }}
        run: |
          IMG_API="ghcr.io/${{ github.repository }}-backend:sha-${{ github.sha }}"
          IMG_FRONT="ghcr.io/${{ github.repository }}-frontend:sha-${{ github.sha }}"
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_API" "$HOOK_API"
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_FRONT" "$HOOK_FRONT"

      - name: Smoke Test QA (espera build y cold start de Render)
        shell: bash
        env:
          URL_API: ${{ vars.QA_API_URL }}
          URL_FRONT: ${{ vars.QA_FRONT_URL }}
        run: |
          echo "Esperando a que QA esté vivo..."
          for i in $(seq 1 30); do
            # /health = proceso vivo; /api/dashboard = la base responde; front = nginx sirve la página
            if curl -fsS --max-time 10 "$URL_API/health" > /dev/null \
               && curl -fsS --max-time 10 "$URL_API/api/dashboard" > /dev/null \
               && curl -fsS --max-time 10 "$URL_FRONT/" > /dev/null; then
              echo "✅ QA responde (API + BD + front)"
              exit 0
            fi
            sleep 20
          done
          echo "❌ QA no respondió a tiempo"
          exit 1

  # =========================================================================
  # JOB 4: PRUEBAS DE INTEGRACIÓN CONTRA LA API DE QA (SIN NAVEGADOR)
  # =========================================================================
  integracion:
    runs-on: ubuntu-latest
    needs: deploy-qa
    timeout-minutes: 15
    steps:
      - name: Bajar código al runner
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias del frontend (sin browser)
        run: npm ci
        working-directory: ./frontend

      - name: Ejecutar Pruebas de Integración contra la API de QA
        env:
          API_BASE_URL: ${{ vars.QA_API_URL }}
        run: npx playwright test e2e/api.spec.js
        working-directory: ./frontend

      - name: Subir Reporte de Integración como Artefacto
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-integracion
          path: frontend/playwright-report

  # =========================================================================
  # JOB 5: PRUEBAS END-TO-END (E2E) CON CHROMIUM CONTRA EL FRONT DE QA
  # =========================================================================
  e2e:
    runs-on: ubuntu-latest
    needs: integracion          # si la API está rota, no gastamos un navegador en confirmarlo
    timeout-minutes: 20
    steps:
      - name: Bajar código al runner
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias y Chromium de Playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium
        working-directory: ./frontend

      - name: Ejecutar Pruebas E2E de UI contra el Frontend de QA
        env:
          E2E_BASE_URL: ${{ vars.QA_FRONT_URL }}
        run: npx playwright test e2e/gastos.spec.js
        working-directory: ./frontend

      - name: Subir Reporte E2E como Artefacto
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-e2e
          path: frontend/playwright-report

  # =========================================================================
  # JOB 6: DESPLIEGUE EN PRODUCCIÓN (GATE HUMANO DE APROBACIÓN)
  # =========================================================================
  deploy-prod:
    runs-on: ubuntu-latest
    needs: e2e                       # EL gate: sin e2e verde ni siquiera se pide aprobación
    environment: production          # ⏸ PAUSADO ESPERANDO APROBACIÓN MANUAL
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - name: Desplegar en PROD la MISMA imagen que verificó QA
        shell: bash
        env:
          HOOK_API: ${{ secrets.RENDER_HOOK_API_PROD }}
          HOOK_FRONT: ${{ secrets.RENDER_HOOK_FRONT_PROD }}
        run: |
          IMG_API="ghcr.io/${{ github.repository }}-backend:sha-${{ github.sha }}"
          IMG_FRONT="ghcr.io/${{ github.repository }}-frontend:sha-${{ github.sha }}"
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_API" "$HOOK_API"
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_FRONT" "$HOOK_FRONT"

      - name: Smoke Test PROD
        shell: bash
        env:
          URL_API: ${{ vars.PROD_API_URL }}
          URL_FRONT: ${{ vars.PROD_FRONT_URL }}
        run: |
          echo "Esperando a que PROD responda..."
          for i in $(seq 1 30); do
            if curl -fsS --max-time 10 "$URL_API/health" > /dev/null \
               && curl -fsS --max-time 10 "$URL_API/api/dashboard" > /dev/null \
               && curl -fsS --max-time 10 "$URL_FRONT/" > /dev/null; then
              echo "✅ PROD responde (API + BD + front)"
              exit 0
            fi
            sleep 20
          done
          echo "❌ PROD no respondió a tiempo"
          exit 1
