# Nombre del pipeline que aparece arriba en la pestaña Actions de GitHub
name: CI

# Disparadores: Se ejecuta automáticamente en Pull Requests y en pushes a main
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # =========================================================================
  # JOB 1: VERIFICACIÓN Y PUBLICACIÓN DEL BACKEND
  # =========================================================================
  build-backend:
    runs-on: ubuntu-latest
    # Mínimo Privilegio: Solo le damos permiso de escribir paquetes a este job
    permissions:
      contents: read
      packages: write
    steps:
      - name: Qué estamos verificando
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA · commit $GITHUB_SHA"

      - name: Bajar el código al runner
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias del backend
        run: npm ci
        working-directory: ./backend

      - name: Ejecutar Unit Tests y Medir Cobertura del Backend
        run: npm run test:coverage
        working-directory: ./backend

      - name: Subir Reporte de Cobertura del Backend como Artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-backend
          path: ./backend/coverage

      # Autenticación en GitHub Packages (Solo se ejecuta cuando entra a main)
      - name: Entrar al registry (ghcr.io)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Preparar el constructor que sabe cachear
        uses: docker/setup-buildx-action@v4

      # EL ÚLTIMO PASO: Construye y publica la imagen en ghcr.io etiquetada con el SHA del commit
      - name: Construir y publicar la imagen del backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/bistolfibri/ingsoft3-tp01-backend:sha-${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  # =========================================================================
  # JOB 2: VERIFICACIÓN Y PUBLICACIÓN DEL FRONTEND
  # =========================================================================
  build-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Qué estamos verificando
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA · commit $GITHUB_SHA"

      - name: Bajar el código al runner
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias del frontend
        run: npm ci
        working-directory: ./frontend

      - name: Ejecutar Unit Tests y Medir Cobertura del Frontend
        run: npm run test:coverage
        working-directory: ./frontend

      - name: Subir Reporte de Cobertura del Frontend como Artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-frontend
          path: ./frontend/coverage

      - name: Entrar al registry (ghcr.io)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Preparar el constructor que sabe cachear
        uses: docker/setup-buildx-action@v4

      - name: Construir y publicar la imagen del frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/bistolfibri/ingsoft3-tp01-frontend:sha-${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # =========================================================================
  # JOB 3: DESPLIEGUE AUTOMÁTICO AL ENTORNO DE QA
  # =========================================================================
  deploy-qa:
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend] # Solo corre si los 2 jobs anteriores pasaron
    if: github.ref == 'refs/heads/main' # Solo corre en pushes a main (los PRs no despliegan)
    environment: qa # Conecta con el entorno qa de GitHub
    env:
      DB_PASSWORD: postgres123
    steps:
      - name: Bajar el código al runner
        uses: actions/checkout@v4

      - name: Levantar Entorno QA con Compose
        run: docker compose -f compose.qa.yml up -d --build

      - name: Smoke Test QA (Comprobación de vida en loop con curl)
        shell: bash
        env:
          URL_API: http://localhost:8080
          URL_FRONT: http://localhost:3000
        run: |
          echo "Esperando a que QA esté vivo..."
          for i in $(seq 1 30); do
            if curl -fsS --max-time 10 "$URL_API/api/dashboard" > /dev/null \
               && curl -fsS --max-time 10 "$URL_FRONT/" > /dev/null; then
              echo "✅ QA responde correctamente (API + BD + Front)"
              exit 0
            fi
            sleep 5
          done
          echo "❌ QA no respondió a tiempo"
          exit 1

  # =========================================================================
  # JOB 4: DESPLIEGUE A PRODUCCIÓN CON APROBACIÓN MANUAL (GATE HUMANO)
  # =========================================================================
  deploy-prod:
    runs-on: ubuntu-latest
    needs: deploy-qa # Solo corre si QA se desplegó y el smoke test dio verde
    environment: production # ⏸ ACÁ EL PIPELINE SE PAUSA HASTA TU APROBACIÓN MANUAL
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    env:
      DB_PASSWORD: postgres123
    steps:
      - name: Bajar el código al runner
        uses: actions/checkout@v4

      - name: Levantar Entorno PROD con Compose
        run: docker compose -f compose.prod.yml up -d --build

      - name: Smoke Test PROD (Comprobación de vida en loop con curl)
        shell: bash
        env:
          URL_API: http://localhost:8081
          URL_FRONT: http://localhost:3001
        run: |
          echo "Esperando a que PROD esté vivo..."
          for i in $(seq 1 30); do
            if curl -fsS --max-time 10 "$URL_API/api/dashboard" > /dev/null \
               && curl -fsS --max-time 10 "$URL_FRONT/" > /dev/null; then
              echo "✅ PROD responde correctamente (API + BD + Front)"
              exit 0
            fi
            sleep 5
          done
          echo "❌ PROD no respondió a tiempo"
          exit 1
          