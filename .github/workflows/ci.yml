name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # =========================================================================
  # JOB 1: VERIFICACIÓN Y PUBLICACIÓN DEL BACKEND
  # =========================================================================
  build-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Bajar el código al runner
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias del backend
        run: npm ci
        working-directory: ./backend

      - name: Ejecutar Unit Tests y Cobertura del Backend
        run: npm run test:coverage
        working-directory: ./backend

      - name: Subir Reporte de Cobertura del Backend
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-backend
          path: ./backend/coverage

      - name: Entrar al registry (ghcr.io)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Preparar constructor Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir y publicar imagen del Backend (Solo en main)
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository }}-backend:sha-${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  # =========================================================================
  # JOB 2: VERIFICACIÓN Y PUBLICACIÓN DEL FRONTEND
  # =========================================================================
  build-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Bajar el código al runner
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias del frontend
        run: npm ci
        working-directory: ./frontend

      - name: Ejecutar Unit Tests y Cobertura del Frontend
        run: npm run test:coverage
        working-directory: ./frontend

      - name: Subir Reporte de Cobertura del Frontend
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-frontend
          path: ./frontend/coverage

      - name: Entrar al registry (ghcr.io)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Preparar constructor Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir y publicar imagen del Frontend (Solo en main)
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository }}-frontend:sha-${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # =========================================================================
  # JOB 3: DESPLIEGUE AUTOMÁTICO EN ENTORNO QA (PULL Y EXECUTE DE GHCR)
  # =========================================================================
  deploy-qa:
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    if: github.ref == 'refs/heads/main'
    environment: qa
    env:
      DB_PASSWORD: postgres123
      IMAGE_TAG: sha-${{ github.sha }}
    steps:
      - name: Bajar código al runner
        uses: actions/checkout@v4

      - name: Levantar Entorno QA con la Imagen Inmutable de GHCR
        run: docker compose -f compose.qa.yml up -d

      - name: Smoke Test QA (Comprobación de respuesta)
        shell: bash
        env:
          URL_API: http://localhost:8080
          URL_FRONT: http://localhost:3000
        run: |
          echo "Esperando a que QA responda..."
          for i in $(seq 1 30); do
            if curl -fsS --max-time 10 "$URL_API/api/dashboard" > /dev/null \
               && curl -fsS --max-time 10 "$URL_FRONT/" > /dev/null; then
              echo "✅ QA responde correctamente"
              exit 0
            fi
            sleep 5
          done
          echo "❌ QA no respondió a tiempo"
          exit 1

  # =========================================================================
  # JOB 4: PRUEBAS DE INTEGRACIÓN CONTRA LA API DE QA (SIN NAVEGADOR)
  # =========================================================================
  integracion:
    runs-on: ubuntu-latest
    needs: deploy-qa
    timeout-minutes: 15
    env:
      DB_PASSWORD: postgres123
      IMAGE_TAG: sha-${{ github.sha }}
    steps:
      - name: Bajar código al runner
        uses: actions/checkout@v4

      - name: Levantar Entorno QA con Docker Compose
        run: |
          docker compose -f compose.qa.yml up -d
          echo "Esperando a que la API de QA responda..."
          for i in $(seq 1 30); do
            if curl -fsS --max-time 10 "http://localhost:8080/api/dashboard" > /dev/null; then
              echo "✅ QA API lista para integración"
              break
            fi
            sleep 3
          done

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias del frontend (sin browser)
        run: npm ci
        working-directory: ./frontend

      - name: Ejecutar Pruebas de Integración contra la API de QA
        env:
          API_BASE_URL: http://localhost:8080
        run: npx playwright test e2e/api.spec.js
        working-directory: ./frontend

      - name: Subir Reporte de Integración como Artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-integracion
          path: frontend/playwright-report

  # =========================================================================
  # JOB 5: PRUEBAS END-TO-END (E2E) CON CHROMIUM CONTRA QA
  # =========================================================================
  e2e:
    runs-on: ubuntu-latest
    needs: integracion
    timeout-minutes: 20
    env:
      DB_PASSWORD: postgres123
      IMAGE_TAG: sha-${{ github.sha }}
    steps:
      - name: Bajar código al runner
        uses: actions/checkout@v4

      - name: Levantar Entorno QA con Docker Compose
        run: |
          docker compose -f compose.qa.yml up -d
          echo "Esperando a que el Frontend de QA responda..."
          for i in $(seq 1 30); do
            if curl -fsS --max-time 10 "http://localhost:3000/" > /dev/null; then
              echo "✅ QA Frontend listo para E2E"
              break
            fi
            sleep 3
          done

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias y Chromium de Playwright
        run: |
          npm ci
          npx playwright install chromium
        working-directory: ./frontend

      - name: Ejecutar Pruebas E2E de UI contra el Frontend de QA
        env:
          E2E_BASE_URL: http://localhost:3000
        run: npx playwright test e2e/gastos.spec.js
        working-directory: ./frontend

      - name: Subir Reporte E2E como Artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-e2e
          path: frontend/playwright-report

  # =========================================================================
  # JOB 6: DESPLIEGUE EN PRODUCCIÓN (GATE HUMANO DE APROBACIÓN)
  # =========================================================================
  deploy-prod:
    runs-on: ubuntu-latest
    needs: e2e
    environment: production # ⏸ PAUSADO ESPERANDO APROBACIÓN MANUAL
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    env:
      DB_PASSWORD: postgres123
      IMAGE_TAG: sha-${{ github.sha }}
    steps:
      - name: Bajar código al runner
        uses: actions/checkout@v4

      - name: Levantar Entorno PROD con la MISMA Imagen de GHCR
        run: docker compose -f compose.prod.yml up -d

      - name: Smoke Test PROD (Comprobación de respuesta)
        shell: bash
        env:
          URL_API: http://localhost:8081
          URL_FRONT: http://localhost:3001
        run: |
          echo "Esperando a que PROD responda..."
          for i in $(seq 1 30); do
            if curl -fsS --max-time 10 "$URL_API/api/dashboard" > /dev/null \
               && curl -fsS --max-time 10 "$URL_FRONT/" > /dev/null; then
              echo "✅ PROD responde correctamente"
              exit 0
            fi
            sleep 5
          done
          echo "❌ PROD no respondió a tiempo"
          exit 1
      