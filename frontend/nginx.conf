server {
    listen 80;

    # 1. Servir los archivos estáticos de React
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 2. Configurar el DNS interno de Docker y la dirección del backend
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_api http://backend:3001;

    # 3. Redirigir todas las consultas a /api hacia el backend
    location /api/ {
        proxy_pass $backend_api;
    }
}
